<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="Making complexity disappear.">
  <rect width="1600" height="640" fill="#ffffff"/>
  <!-- Tout est calé sur le même bord droit (x = 1504) ; le letter-spacing final est compensé pour que le dernier glyphe tombe exactement sur ce bord. -->
  <text x="1510" y="104" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" letter-spacing="6" fill="#6e7781" text-anchor="end">PARIS — FRANCE</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="136" letter-spacing="-5" fill="#0d1117" text-anchor="end">
    <text x="1499" y="262">Making</text>
    <text x="1499" y="386">complexity</text>
    <text x="1499" y="510">disappear.</text>
  </g>
  <rect x="1420" y="546" width="84" height="2" fill="#0d1117"/>
  <text x="1509" y="590" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17" letter-spacing="5" fill="#6e7781" text-anchor="end">LESS FRICTION. MORE POSSIBILITY.</text>
</svg>
