<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="Making complexity disappear.">
  <rect width="1600" height="560" fill="#0d1117"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="136" letter-spacing="-5" fill="#f0f6fc" text-anchor="end">
    <text x="1499" y="190">Making</text>
    <text x="1499" y="314">complexity</text>
    <text x="1499" y="438">disappear.</text>
  </g>
  <rect x="1420" y="474" width="84" height="2" fill="#f0f6fc"/>
  <text x="1509" y="518" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17" letter-spacing="5" fill="#8b949e" text-anchor="end">LESS FRICTION. MORE POSSIBILITY.</text>
</svg>
