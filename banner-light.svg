<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="Making complexity disappear.">
  <rect width="1600" height="640" fill="#ffffff"/>
  <text x="96" y="112" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20" letter-spacing="6" fill="#6e7781">PARIS — FRANCE</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" fill="#0d1117" text-anchor="end">
    <text x="1504" y="300" font-size="132" letter-spacing="-5">Making</text>
    <text x="1504" y="420" font-size="132" letter-spacing="-5">complexity</text>
    <text x="1504" y="540" font-size="132" letter-spacing="-5">disappear.</text>
  </g>
  <rect x="1420" y="572" width="84" height="2" fill="#0d1117"/>
  <text x="1504" y="612" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" letter-spacing="5" fill="#6e7781" text-anchor="end">LESS FRICTION. MORE POSSIBILITY.</text>
</svg>
